[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clusterscheduler"
version = "0.3.0"
description = "Send a Slurm job to whichever of your clusters will start it soonest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "rich-click>=1.9.4",
]

[project.scripts]
rclust = "rclust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rclust", "scheduler"]  # scheduler: old import name

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
